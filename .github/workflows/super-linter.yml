---
name: Super Linter

"on":
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  super-linter:
    name: Super Linter
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/super-linter.yml@7254f4a35b6251bf442bf84335b6bd27f9d88689 # v4.1.4
    with:
      # VALIDATE_KUBERNETES_KUBECONFORM is set to false as it cannot process Helm charts
      # FILTER_REGEX_EXCLUDE excludes prompt files - they're for AI consumption, not human documentation
      super-linter-variables: |
        {
          "FILTER_REGEX_EXCLUDE": ".github/prompts/.*",
          "VALIDATE_KUBERNETES_KUBECONFORM": false
        }
