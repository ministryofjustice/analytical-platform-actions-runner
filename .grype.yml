---
# Grype configuration file for container vulnerability scanning
# https://oss.anchore.com/docs/reference/grype/configuration/

# Ignore the runner-bundled Node CVE until the upstream runner image is refreshed.
ignore:
  - vulnerability: CVE-2026-48617
    reason: |
      This vulnerability is in the bundled Node binaries shipped with the GitHub
      Actions runner image. It is upstream to this repository and will be resolved
      when the runner image is updated to a version that includes a fixed Node
      release.

  - vulnerability: GHSA-r292-9mhp-454m
    reason: |
      DoS in the `tar` package bundled with npm's node_modules inside the GitHub
      Actions runner image's node20 and node24 externals (npm bundles vulnerable
      tar 6.2.1 / 7.5.15). This is upstream to this repository and will be
      resolved when the runner image ships an npm build with tar >= 7.5.21.

  - vulnerability: GHSA-w4pp-8pjf-rmxw # CVE-2026-9496
    package:
      name: pacote
      version: 18.0.6
      type: npm
      location: "/actions-runner/externals/node20/**"
    reason: |
      ReDoS (CWE-1333/CWE-400) in pacote's addGitSha, bundled with the npm
      shipped inside the GitHub Actions runner's node20 externals. Availability
      -only impact (CVSS 7.7, EPSS 0.049%); requires an attacker-controlled git
      spec.rawSpec to be resolved via npm install. Upstream fixed in pacote
      21.5.1 (npm/pacote#498), already present in node24's bundled npm as of
      actions-runner v2.337.0. node20 externals are frozen (no further
      dependency bumps) ahead of GitHub's removal of Node 20 from the runner
      on 2026-09-16, after which this package path disappears entirely.
      Reassess if not already resolved by 2026-09-30.
